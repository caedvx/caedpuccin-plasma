general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/caedvx/.local/share/wallpapers/ODIVM-Graphite/graphite-plain-1920x1080.png
    color = rgb(000000)
}

image {
    monitor =
    path = /home/caedvx/.local/share/odivm/odivm-mark-light-512.png
    size = 96
    border_size = 0
    rounding = 0
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(ffffff)
    font_family = Unbounded SemiBold
    font_size = 64
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B" | tr a-z A-Z
    color = rgba(255, 255, 255, 0.35)
    font_family = Geist Mono Medium
    font_size = 11
    position = 0, -30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.4
    outer_color = rgba(255, 255, 255, 0.11)
    inner_color = rgba(255, 255, 255, 0.045)
    font_color = rgb(ffffff)
    check_color = rgb(9a9a9a)
    fail_color = rgb(f87171)
    capslock_color = rgb(fbbf24)
    fade_on_empty = false
    placeholder_text = <span foreground="##a3a3a3">Password</span>
    rounding = 10
    position = 0, -110
    halign = center
    valign = center
}
