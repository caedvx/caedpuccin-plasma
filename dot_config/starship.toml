# Get a clean, instant prompt layout
format = """
$directory\
$git_branch\
$git_status\
$character"""

# Sits completely flush on one clean line
add_newline = false

[character]
success_symbol = "[❯](bold #ffffff)"
error_symbol = "[❯](bold #f87171)"

[directory]
style = "bold #ffffff"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "#a3a3a3"
format = "on [$symbol$branch]($style) "

[git_status]
format = '[$all_status$ahead_behind]($style) '
style = "#f87171"
conflicted = '='
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?'
stashed = '$'
modified = '!'
staged = '+'
renamed = '»'
deleted = '✘'
